version: "2"
linters:
  default: all
  disable:
  - depguard
  - wsl
  exclusions:
    rules:
    # Code ported from upstream projects keeps its original style, so it is
    # easier to compare with upstream. Correctness linters still apply.
    - path: ssh/knownhosts/knownhosts(_test)?\.go|ssh/agent/pageant_windows\.go
      linters:
      - cyclop
      - dogsled
      - embeddedstructfieldcheck
      - err113
      - exhaustruct
      - exhaustruct_v5
      - funlen
      - goconst
      - ireturn
      - lll
      - mnd
      - nlreturn
      - noinlineerr
      - nonamedreturns
      - testpackage
      - varnamelen
      - wrapcheck
      - wsl_v5
    # Pageant is reached through Win32 calls that need unsafe pointers and
    # package level procedure handles.
    - path: ssh/agent/pageant_windows\.go
      linters:
      - gochecknoglobals
      - godot
      - gosec
    # copyData mirrors the Win32 COPYDATASTRUCT layout.
    - path: ssh/agent/pageant_windows\.go
      linters:
      - govet
      text: fieldalignment
  settings:
    gomoddirectives:
      replace-local: true
    govet:
      enable-all: true
    revive:
      enable-default-rules: true
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
  settings:
    gci:
      sections:
        - standard # Standard section: captures all standard packages.
        - default # Default section: contains all imports that could not be matched to another section type.
        - prefix(github.com/go-git/go-git/) # Custom section: groups all imports with the specified Prefix.
        - blank # Blank section: contains all blank imports. This section is not present unless explicitly enabled.
        - dot # Dot section: contains all dot imports. This section is not present unless explicitly enabled.
        - localmodule # Local module section: contains all local packages. This section is not present unless explicitly enabled.
      no-inline-comments: true
      no-prefix-comments: true
      custom-order: true
      no-lex-order: true
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
    gofumpt:
      extra-rules: true
